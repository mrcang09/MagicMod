id: "chest_overlay"
title: "Chest Overlay"
replace_vanilla: true
match_titles:
  - "Chest"
  - "Large Chest"
  - "&aChest"
  - "&aLarge Chest"
background:
  color: "#AA0B0F14"
elements:
