id: "magic_hud"
title: "Magic HUD"
hud: true
replace_hud: true
draw_background: false
elements:
  - id: "hud_health"
    type: "text"
    text: "HP {health}/{max_health}"
    font: "original"
    x: 8
    y: "h - 70"
    z: 5
    color: "#ffffff"
    scale: 1.0
    shadow: true
  - id: "hud_food"
    type: "text"
    text: "Food {food}"
    font: "original"
    x: 8
    y: "h - 58"
    z: 5
    color: "#ffffff"
    scale: 1.0
    shadow: true
  - id: "hud_xp"
    type: "text"
    text: "XP Lv {exp_level} ({exp}%)"
    font: "original"
    x: 8
    y: "h - 46"
    z: 5
    color: "#ffffff"
    scale: 1.0
    shadow: true
  - id: "hud_player"
    type: "entity"
    target_type: "player"
    look_at_mouse: false
    x: 8
    y: "h - 150"
    width: 60
    height: 60
    entity_scale: 30
    z: 3
  - id: "hotbar_slot_0"
